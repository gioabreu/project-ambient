name: Release integrity

on:
  pull_request:
    paths:
      - ".github/workflows/release-integrity.yml"
      - "distribution/**"
      - "docs/release-checklist.md"
      - "docs/launch-day-runbook.md"
      - "script/**"
      - "schemas/rights/**"
      - "schemas/aerial-parity/**"
      - "schemas/resource-budgets/**"
      - "docs/product/aerial-parity.json"
      - "docs/product/FULL_PLATFORM_LAUNCH_SPEC.md"
      - "fixtures/rights/**"
      - "fixtures/resource-budgets/**"
      - "CONTENT_RIGHTS.md"
      - "OPEN_SOURCE_PROMISE.md"
      - "DCO.txt"
      - "services/mcp/**"
      - "apps/macos/**"
      - "apps/site/**"
      - "README.md"
      - "LICENSE"
      - "PRIVACY.md"
      - "SECURITY.md"
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-contracts:
    name: Static release contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.20.0
      - name: Check shell syntax
        run: |
          for script in script/*.sh; do
            bash -n "$script"
          done
      - name: Verify the Homebrew cask contract
        run: ./script/verify_homebrew_cask.sh
      - name: Install locked contract-validator dependencies
        run: npm ci --ignore-scripts --prefix services/mcp
      - name: Verify remaining lockfile installation plans
        run: |
          npm ci --ignore-scripts --dry-run --prefix apps/site
          npm ci --ignore-scripts --dry-run --prefix script/mcpb-tooling
      - name: Check deterministic SBOM generator syntax
        run: |
          node --check script/generate_release_sbom.mjs
          node --test script/generate_release_sbom.test.mjs
      - name: Validate platform capability and release-binding contracts
        run: node script/validate_capabilities.mjs
      - name: Validate media-rights and commercial-boundary contracts
        run: node script/validate_rights.mjs
      - name: Validate base-M4 resource-budget contract
        run: node script/validate_resource_budgets.mjs
      - name: Validate base-M4 static-wakeup qualification plan
        run: node script/validate_m4_static_wakeup_qualification.mjs
      - name: Validate base-M4 static-wakeup automated preflight
        run: node script/validate_m4_static_wakeup_preflight.mjs
      - name: Validate base-M4 static-wakeup collector protocol
        run: node script/collect_m4_static_wakeup_qualification.mjs --self-test
      - name: Validate macOS media capability probe contract
        run: node script/validate_macos_media_capability_probe.mjs --self-test
      - name: Validate the exhaustive Aerial semantic-parity launch matrix
        run: node script/validate_aerial_parity.mjs
      - name: Enforce verified Aerial parity for GA tags
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        run: node script/validate_aerial_parity.mjs --ga

  package-candidate:
    name: Build and verify universal release candidate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: |
            services/mcp/package-lock.json
            apps/site/package-lock.json
            script/mcpb-tooling/package-lock.json
      - name: Install locked JavaScript dependencies
        run: |
          npm ci --prefix services/mcp
          npm ci --prefix apps/site
      - name: Determine release version
        id: version
        run: echo "value=$(node -p 'require("./services/mcp/package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Require the tag to match release metadata
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v${{ steps.version.outputs.value }}" = "$GITHUB_REF_NAME"
      - name: Package and verify unsigned artifacts
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            ./script/package_release.sh --tagged-release "$GITHUB_REF_NAME" "${{ steps.version.outputs.value }}"
          else
            ./script/package_release.sh --candidate "${{ steps.version.outputs.value }}"
          fi
